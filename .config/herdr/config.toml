onboarding = false
[keys]
prefix = "ctrl+a"
settings = "prefix+shift+s"
workspace_picker = "prefix+s"
new_workspace = "prefix+f"
new_tab = "prefix+c"
edit_scrollback = ""
copy_mode = "prefix+{"
toggle_sidebar = "prefix+e"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "ctrl+h"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
navigate_pane_right = "ctrl+l"
split_horizontal = "prefix+h"
split_vertical = "prefix+v"

[theme]
name = "tokyo-night"
auto_switch = false

[ui]
prompt_new_tab_name = false

[[keys.command]]
key = "prefix+["
type = "pane"
command = "herdr pane read \"$HERDR_ACTIVE_PANE_ID\" --source recent-unwrapped --lines 20000 --format text | nvim - '+normal! G'"
description = "edit scrollback"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"
